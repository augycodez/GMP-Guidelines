:root {

    --shadow-3: 0 8px 28px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.05);
    --ease: cubic-bezier(0.25,0.46,0.45,0.94);
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Helvetica Neue', sans-serif;
    background: var(--c-bg);

.mono { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; }
.site-header { background: var(--c-surface); border-bottom: 1px solid var(--c-border); }
.stat-tile { background: var(--c-surface); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow-1) !important; text-align: center; }
.stat-num { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; color: var(--c-primary); line-height: 1; }
.stat-label { font-size: 11px; color: var(--c-secondary); margin-top: 4px; font-weight: 500; }
.search-wrap { background: var(--c-surface); border-radius: var(--r-btn); border: 1.5px solid #d2d2d7; display: flex; align-items: center; padding: 0 16px; gap: 8px; transition: all 0.15s var(--ease); height: 42px; }

.search-icon { color: var(--c-tertiary); flex-shrink: 0; }

.seg-btn { padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--c-secondary); border: none; background: transparent; cursor: pointer; white-space: nowrap; transition: all 0.15s var(--ease); line-height: 1; }

.filter-pill.active { background: var(--c-primary); color: var(--c-surface); border-color: var(--c-primary); }

}

function getSourceOrg(source) {
  if (/^PDA/i.test(source)) return 'PDA';
  if (/^ISPE/i.test(source)) return 'ISPE';
  if (/^FDA/i.test(source)) return 'FDA';
  if (/^PIC\/S|^PICS/i.test(source)) return 'PIC/S';
  if (/^ISO/i.test(source)) return 'ISO';
  if (/^ECA/i.test(source)) return 'ECA';
  if (/^USP/i.test(source)) return 'USP';
  if (/^ICH/i.test(source)) return 'ICH';
  return source.split(/[\s\-]/)[0];
}

function initFilters(){
    const tagCounts={};
    documents.forEach(d=>d.tags.forEach(t=>{tagCounts[t]=(tagCounts[t]||0)+1;}));
    const topTags=Object.entries(tagCounts).filter(([,c])=>c>=5).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([t])=>t);
    const list=['all',...topTags];
    document.getElementById('filterBtns').innerHTML=list.map(f=>{
        const a=f===activeFilter;
        return `<button class="filter-pill${a?' active':''}" onclick="setFilter('${f}')">${f==='all'?'All':f}</button>`;
    }).join('');
}

let prevSort='date-desc';
function getSnippet(content,query){const l=content.toLowerCase(),i=l.indexOf(query);if(i===-1)return'';const s=Math.max(0,i-40),e=Math.min(content.length,i+query.length+60);let sn=(s>0?'...':'')+content.substring(s,e)+(e<content.length?'...':'');const esc=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return sn.replace(new RegExp('('+esc+')','gi'),'<mark>$1</mark>');}

function getFiltered(){
    let d=[...documents];const s=document.getElementById('searchBox').value.toLowerCase().trim();
    const sortEl=document.getElementById('sortSelect');
    if(s&&sortEl.value!=='relevance'&&!sortEl._userChanged){prevSort=sortEl.value;sortEl.value='relevance';}
    else if(!s&&sortEl.value==='relevance'&&!sortEl._userChanged){sortEl.value=prevSort;}
    sortEl._userChanged=false;
    d.forEach(x=>{x._hits=null;x._score=0;x._matchTypes=[];});
    if(s){d=d.filter(x=>{let sc=0;const ty=[];
        if(x.title.toLowerCase().includes(s)){sc+=10;ty.push('title');}
        if(x.titleZh&&x.titleZh.includes(s)){sc+=8;ty.push('title');}
        if(x.tags.some(t=>t.toLowerCase().includes(s))){sc+=5;ty.push('tag');}
        if(x.summary.toLowerCase().includes(s)){sc+=3;ty.push('summary');}
        if(x.source.toLowerCase().includes(s)){sc+=2;ty.push('title');}
        if(x.pages&&x.pages.toLowerCase().includes(s)){sc+=2;ty.push('title');}
        const secs=sectionsByFile[x.file]||[];
        const hits=secs.filter(sec=>sec.content.toLowerCase().includes(s));
        if(hits.length>0){sc+=Math.min(hits.length,8);ty.push('content');x._hits=hits.map(h=>({sectionTitle:h.sectionTitle,snippet:getSnippet(h.content,s)}));}
        x._score=sc;x._matchTypes=[...new Set(ty)];return sc>0;
    });}
    if(activeSource!=='all'){d=d.filter(x=>getSourceOrg(x.source)===activeSource);}
    if(activeFilter!=='all'){d=d.filter(x=>x.tags.includes(activeFilter));}
    const sort=sortEl.value;
    if(sort==='relevance'&&s)d.sort((a,b)=>b._score-a._score||b.date.localeCompare(a.date));
    else if(sort==='date-desc')d.sort((a,b)=>b.date.localeCompare(a.date));
    else if(sort==='date-asc')d.sort((a,b)=>a.date.localeCompare(b.date));
    else if(sort==='source')d.sort((a,b)=>a.source.localeCompare(b.source)||a.date.localeCompare(b.date));
    return d;
}

function renderCards(){
    const docs=getFiltered();const s=document.getElementById('searchBox').value.toLowerCase().trim();
    const ce=document.getElementById('resultCount');
    if(ce){ce.textContent=s?`${docs.length} results`:'';ce.style.display=s?'inline':'none';}
    document.body.classList.toggle('search-active',!!s);
    if(!docs.length){document.getElementById('docGrid').innerHTML='<div class="col-span-full text-center py-12 text-gray-400">No documents match.</div>';return;}
    const mx=Math.max(...docs.map(d=>d._score||0),1);
    const _lv=getLastViewed();
    const _readMap=Object.fromEntries(getReadHistory().map(h=>[h.file,h]));

    document.getElementById('docGrid').innerHTML=docs.map((d,i)=>{
        const sc=sourceColors[d.source]||{bg:'#f1f5f9',text:'#475569',short:d.source};
        const tags=d.tags.slice(0,3).map(t=>`<span class="tag-pill ${tagCls[t]||'bg-gray-100 text-gray-600'}">${t}</span>`).join('');
        const fb=d.figures?`<span class="tag-pill bg-orange-50 text-orange-600">${d.figures} fig</span>`:'';
        const isLV=_lv&&_lv.file===d.file;
        const readEntry=_readMap[d.file]||null;
        const prog=getProgress(d.file);
        const _href=d.file?getOpenHref(d.file):'';
        const statusBadge = isLV
            ? `<span class="last-viewed-badge">\u4e0a\u6b21\u95b1\u8b80</span>`
            : (readEntry && prog && prog.pct !== undefined)
            ? `<span class="read-badge">${prog.pct >= 95 ? '\u2713 \u5b8c\u8b80' : '\u5df2\u8b80\u00a0' + prog.pct + '%'}</span>`
            : (readEntry && prog && prog.num)
            ? `<span class="read-badge">Sec\u00a0${prog.num}</span>`
            : readEntry
            ? `<span class="read-badge">\u2713 \u5df2\u8b80</span>`
            : '';
        const btn=d.file?`<a href="${_href}" target="_blank" data-track-file="${d.file}" data-track-title="${d.title.replace(/"/g,'&quot;')}" data-track-zh="${(d.titleZh||'').replace(/"/g,'&quot;')}"
            class="track-open open-btn" style="background:${sc.bar||sc.bg||'#1d1d1f'}">${prog?'\u7e7c\u7e8c\u95b1\u8b80':'Open'}</a>`:'';
        let rel='';
        if(s&&d._score>0){const p=Math.round(d._score/mx*100);const bc=p>=70?'#334155':p>=40?'#64748b':'#94a3b8';
            const bm={title:'Title',tag:'Tag',summary:'Summary',content:'Content'};
            const bl={title:'match-badge-title',tag:'match-badge-tag',summary:'match-badge-summary',content:'match-badge-content'};
            const mb=d._matchTypes.map(t=>`<span class="match-badge ${bl[t]}">${bm[t]}</span>`).join('');
            rel=`<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div class="match-badges">${mb}</div><div style="flex:1;background:#f1f5f9;border-radius:980px;height:3px"><div class="relevance-bar" style="width:${p}%;background:${bc}"></div></div><span class="mono" style="font-size:10px;color:#aeaeb2">#${i+1}</span></div>`;}
        let hh='';
        if(d._hits&&d._hits.length>0){const sh=d._hits.slice(0,3);const mo=d._hits.length>3?`<div style="font-size:10px;color:#aeaeb2;margin-top:4px">+${d._hits.length-3} more</div>`:'';
            hh=`<div class="search-hits"><div class="hit-title">Content matches (${d._hits.length})</div>${sh.map(h=>`<div style="font-size:10px"><span style="font-weight:600;color:#3a3a3c">${h.sectionTitle}</span>: ${h.snippet}</div>`).join('')}${mo}</div>`;}
        const sm=!s,ss=!s||!(d._hits&&d._hits.length>0);
        return `<div class="doc-card fade-up${isLV?' is-last-viewed':''}${readEntry&&!isLV?' is-read':''}">
            <div class="card-bar" style="background:${sc.bar||sc.bg||'#e8e8ed'}"></div>
            <div class="card-body">
                ${sm?`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
                    <span style="font-size:11px;font-weight:600;letter-spacing:0.02em;color:${sc.text||'#6e6e73'}">${sc.short}</span>
                    <div style="display:flex;align-items:center;gap:6px">
                        ${statusBadge}
                        <span class="mono" style="font-size:10px;color:#aeaeb2">${d.date}</span>
                    </div>
                </div>`:''}
                <h3 style="font-size:15px;font-weight:600;line-height:1.35;color:#1d1d1f">${d.title}</h3>
                ${d.titleZh?`<p style="font-size:13px;color:#3a3a3c;margin-top:4px;line-height:1.35">${d.titleZh}</p>`:''}
                ${sm?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${tags}${fb}</div>`:''}
                ${rel}
                ${ss?`<p style="font-size:13px;color:#6e6e73;line-height:1.6;margin-top:12px;flex:1">${d.summary}</p>`:''}
                ${hh}
                <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.06)">
                    <div style="display:flex;align-items:center;gap:10px">
                        <span class="mono" style="font-size:11px;color:#aeaeb2">${d.pages||''}</span>
                        ${d.sections?`<span style="font-size:11px;color:#aeaeb2">${d.sections}&thinsp;sec</span>`:''}
                    </div>
                    ${btn}
                </div>
            </div>
        </div>`;
    }).join('');
}

// ============================================================
// LAST VIEWED + READ HISTORY TRACKING
// ============================================================
const LS_KEY = 'sgk_last_viewed';
const LS_HISTORY = 'sgk_read_history';

function getReadHistory() {
    try { return JSON.parse(localStorage.getItem(LS_HISTORY) || '[]'); } catch(e) { return []; }
}
function getReadEntry(file) {
    return getReadHistory().find(x => x.file === file) || null;
}
function trackOpen(file, title, titleZh) {
    try {
        localStorage.setItem(LS_KEY, JSON.stringify({ file, title, titleZh, ts: Date.now() }));
        const hist = getReadHistory();
        const ex = hist.find(h => h.file === file);
        if (ex) { ex.lastRead = Date.now(); ex.count = (ex.count || 1) + 1; }
        else { hist.push({ file, title, titleZh, firstRead: Date.now(), lastRead: Date.now(), count: 1 }); }
        localStorage.setItem(LS_HISTORY, JSON.stringify(hist));
        renderHistoryPanel();
        // Update the read-count stat badge live
        const sc = document.querySelector('#statsRow div:last-child .mono');
        if (sc) sc.textContent = getReadHistory().length;
    } catch(e) {}
}

function getProgress(file) {
    // Derive progress key from file path (matches merged HTML's _pKey)
    const stem = file.split('/').pop().replace('.html','');
    try { return JSON.parse(localStorage.getItem('sgk_progress_' + stem) || 'null'); } catch(e) { return null; }
}

function getOpenHref(file) {
    const p = getProgress(file);
    // Scroll-tracked docs (scrollY present) restore position via page JS — no hash needed
    if (p && p.scrollY !== undefined) return file;
    return p && p.id ? file + '#' + p.id : file;
}

function markComplete(file) {
    try {
        const stem = file.split('/').pop().replace('.html','');
        const key = 'sgk_progress_' + stem;
        const cur = JSON.parse(localStorage.getItem(key) || 'null') || {};
        localStorage.setItem(key, JSON.stringify({
            id: cur.id || 'sec0', num: cur.num || '0',
            label: cur.label || 'Complete',
            scrollY: cur.scrollY, pct: 100, complete: true, ts: Date.now()
        }));
        renderHistoryPanel();
        renderCards();
    } catch(e) {}
}

function getLastViewed() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e) { return null; }
}

function timeAgo(ts) {
    const mins = Math.floor((Date.now() - ts) / 60000);
    if (mins < 2) return '';
    if (mins < 60) return `${mins} `;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs} `;
    const days = Math.floor(hrs / 24);
    if (days === 1) return '';
    if (days < 30) return `${days} `;
    return `${Math.floor(days / 30)} `;
}

// ============================================================
// HISTORY PANEL
// ============================================================
let historyOpen = true;
function toggleHistory() {
    historyOpen = !historyOpen;
    const panel = document.getElementById('historyPanel');
    const chevron = document.getElementById('historyChevron');
    if (panel) panel.classList.toggle('open', historyOpen);
    if (chevron) chevron.style.transform = historyOpen ? 'rotate(180deg)' : '';
}

function renderHistoryPanel() {
    const hist = getReadHistory().slice().sort((a,b) => b.lastRead - a.lastRead);
    const wrap = document.getElementById('historyWrap');
    const countEl = document.getElementById('historyCount');
    const listEl = document.getElementById('historyList');
    if (!wrap) return;
    if (!hist.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'block';
    if (countEl) countEl.textContent = hist.length;
    if (!listEl) return;
    listEl.innerHTML = hist.map((h, idx) => {
        const isLatest = idx === 0;
        const prog = getProgress(h.file);
        const isComplete = prog && prog.complete;
        const progSpan = isComplete
            ? `<span class="text-[10px] px-1.5 py-0.5 rounded border whitespace-nowrap text-emerald-700 bg-emerald-50 border-emerald-200 font-semibold">✓ </span>`
            : prog && prog.pct !== undefined
            ? `<span class="text-[10px] px-1.5 py-0.5 rounded border whitespace-nowrap text-blue-700 bg-blue-50 border-blue-200" title=""> ${prog.pct}%</span>`
            : prog && prog.num
            ? `<span class="text-[10px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200 whitespace-nowrap">&#9654; Sec ${prog.num}${prog.label ? ': ' + prog.label : ''}</span>`
            : '';
        const markBtn = !isComplete
            ? `<button onclick="markComplete('${h.file.replace(/'/g,"\\'")}');" title=""
                       class="text-[10px] text-gray-300 hover:text-emerald-600 transition-colors flex-shrink-0 border border-gray-200 hover:border-emerald-300 rounded px-1.5 py-0.5 leading-none">✓</button>`
            : '';
        const href = h.file ? getOpenHref(h.file) : '#';
        const displayTitle = h.titleZh || h.title;
        const rowBg = isLatest ? 'bg-amber-50 hover:bg-amber-100' : 'hover:bg-gray-50';
        const label = isLatest
            ? `<span class="last-viewed-badge flex-shrink-0"></span>`
            : `<span class="read-badge flex-shrink-0">✓ </span>`;
        const btnLabel = isLatest ? '' : '';
        const btnStyle = isLatest ? 'background:#92400e' : 'background:#334155';
        return `<div class="flex items-center gap-2 px-4 py-2.5 transition-colors ${rowBg}">
            ${label}
            <span class="text-xs text-gray-800 flex-1 min-w-0 truncate font-${isLatest?'medium':'normal'}" title="${displayTitle}">${displayTitle}</span>
            ${progSpan}
            ${markBtn}
            <span class="text-[10px] text-gray-400 whitespace-nowrap flex-shrink-0">${timeAgo(h.lastRead)}</span>
            <a href="${href}" target="_blank" data-track-file="${h.file}" data-track-title="${h.title}" data-track-zh="${h.titleZh||''}"
               class="track-open text-[10px] text-white px-2 py-1 rounded no-underline flex-shrink-0 transition-colors" style="${btnStyle}">${btnLabel}</a>
            <button onclick="removeReadEntry('${h.file.replace(/'/g, '\\')}');renderHistoryPanel();renderCards();"
                    class="text-gray-300 hover:text-red-400 text-sm leading-none transition-colors flex-shrink-0">&times;</button>
        </div>`;
    }).join('');
}

function removeReadEntry(file) {
    try {
        const hist = getReadHistory().filter(h => h.file !== file);
        localStorage.setItem(LS_HISTORY, JSON.stringify(hist));
        const sc = document.querySelector('#statsRow div:last-child .mono');
        if (sc) sc.textContent = hist.length;
        // Also clear isLV card badge if this was the last viewed doc
        const lv = getLastViewed();
        if (lv && lv.file === file) localStorage.removeItem(LS_KEY);
    } catch(e) {}
}

function clearReadHistory() {
    try {
        localStorage.removeItem(LS_HISTORY);
        document.getElementById('historyWrap').style.display = 'none';
        const sc = document.querySelector('#statsRow div:last-child .mono');
        if (sc) sc.textContent = '0';
        renderCards();
    } catch(e) {}
}

// Delegated click handler for all Open buttons (incl. resume banner)
document.addEventListener('click', e => {
    const a = e.target.closest('a.track-open');
    if (!a) return;
    const file  = a.dataset.trackFile;
    const title = a.dataset.trackTitle;
    const zh    = a.dataset.trackZh || '';
    if (file) trackOpen(file, title, zh);
});

let st;document.getElementById('searchBox').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(renderCards,150);});
loadData().then(()=>{initSourceFilters();initFilters();renderStats();renderCards();renderHistoryPanel();});
</script>
